      <svg class="campus" viewBox="0 0 800 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

    </section>

    <section class="login-right">
      <div class="login-card">
        <h1 class="login-title">教育部化學雲</h1>
        <p class="login-welcome">歡迎使用</p>

        <form id="login-form" novalidate autocomplete="off">
          <div class="login-field" data-field="code">
            <label for="f-code">學校代號</label>
            <input type="text" id="f-code" name="code" autocomplete="off">
            <div class="form-error" data-err="code"></div>
          </div>
          <div class="login-field" data-field="account">
            <label for="f-account">帳號</label>
            <input type="text" id="f-account" name="account" autocomplete="off">
            <div class="form-error" data-err="account"></div>
          </div>
          <div class="login-field" data-field="pwd">
            <label for="f-pwd">密碼</label>
            <div class="pwd-wrap">
              <input type="password" id="f-pwd" name="pwd" autocomplete="new-password">
              <button type="button" id="pwd-toggle" class="pwd-toggle" aria-label="顯示密碼" title="顯示／隱藏密碼">👁</button>
            </div>
            <div class="form-error" data-err="pwd"></div>
          </div>
          <div class="login-remember">
            <label><input type="checkbox" id="f-remember"> 記住帳號</label>
          </div>
          <div class="form-error login-error" id="login-error"></div>
          <button type="submit" class="btn btn-primary login-btn">登入</button>
        </form>

        <div class="demo-accounts">
          <div class="demo-head">展示帳號 <span class="poc-badge">POC 模擬登入</span></div>
          <p class="demo-note">學校代號 <b>DEMO01</b>（不分大小寫）。點選下列列可自動帶入。</p>
          <table class="demo-table">
            <thead><tr><th>帳號</th><th>角色</th><th>密碼</th></tr></thead>
            <tbody>
              <tr data-account="admin"><td>admin</td><td>系統管理者</td><td>1234</td></tr>
              <tr data-account="manager"><td>manager</td><td>管理者</td><td>1234</td></tr>
              <tr data-account="user"><td>user</td><td>使用者</td><td>1234</td></tr>
              <tr data-account="reader"><td>reader</td><td>唯讀使用者</td><td>1234</td></tr>
            </tbody>
          </table>
        </div>
        <div class="login-footer">威煦軟體 Tel：(02)2727-1685　Email：service@wishingsoft.com</div>
