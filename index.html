<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JamesFu168 — GitHub Pages 專案入口</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #26354d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --badge-bg: rgba(56, 189, 248, 0.12);
      --badge-text: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
    }

    .profile-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--bg-card);
    }

    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      min-width: 240px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .github-link:hover {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    main {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-actions {
      display: flex;
      gap: 0.6rem;
    }

    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 0.55rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="profile-group">
      <img class="avatar" src="https://github.com/jamesfu168.png" alt="JamesFu168" />
      <div class="title-group">
        <h1>JamesFu168 GitHub Pages</h1>
        <p>自動列出目前已發佈公開網頁的所有專案目錄</p>
      </div>
    </div>
    <div class="controls">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="搜尋專案名稱或描述..."
        aria-label="搜尋專案"
      />
      <a class="github-link" href="https://github.com/JamesFu168?tab=repositories" target="_blank" rel="noopener">
        GitHub 專案列表 ↗
      </a>
    </div>
  </header>

  <main>
    <div class="status-bar">
      <span id="countText">正在從 GitHub API 載入已公開的 GitHub Pages 專案...</span>
      <span id="syncTime"></span>
    </div>
    <div id="repoGrid" class="grid"></div>
  </main>

  <footer>
    Powered by GitHub Pages &amp; GitHub REST API · 自動同步 <code>jamesfu168.github.io</code> 下的公開網站
  </footer>

  <script>
    const USERNAME = 'jamesfu168';
    const ROOT_REPO = `${USERNAME}.github.io`;
    const FALLBACK_REPOS = [
      {
        name: 'Edu-Prototype',
        description: '教育平台原型專案 (GitHub Pages)',
        language: 'TypeScript / HTML',
        updated_at: new Date().toISOString(),
        html_url: 'https://github.com/JamesFu168/Edu-Prototype',
        has_pages: true
      }
    ];

    let allPagesRepos = [];

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleDateString('zh-TW', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    function renderRepos(filterText = '') {
      const grid = document.getElementById('repoGrid');
      const countText = document.getElementById('countText');
      const keyword = filterText.trim().toLowerCase();

      const filtered = allPagesRepos.filter(repo => {
        const nameMatch = repo.name.toLowerCase().includes(keyword);
        const descMatch = (repo.description || '').toLowerCase().includes(keyword);
        return nameMatch || descMatch;
      });

      countText.textContent = `共找到 ${filtered.length} 個已公開的 GitHub Pages 網站`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            沒有找到符合條件的 GitHub Pages 專案。
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(repo => {
        const siteUrl = `https://${USERNAME}.github.io/${repo.name}/`;
        const desc = repo.description || '尚無專案描述';
        const lang = repo.language || 'Web';
        const updated = formatDate(repo.updated_at || repo.pushed_at);

        return `
          <article class="card">
            <div>
              <div class="card-header">
                <h2 class="card-title">/${repo.name}</h2>
                <span class="badge">${lang}</span>
              </div>
              <p class="card-desc">${desc}</p>
            </div>
            <div>
              <div class="card-meta">
                <span>網址：${USERNAME}.github.io/${repo.name}</span>
                <span>更新：${updated}</span>
              </div>
              <div class="card-actions">
                <a class="btn btn-primary" href="${siteUrl}" target="_blank" rel="noopener">開啟網站 ↗</a>
                <a class="btn btn-secondary" href="${repo.html_url}" target="_blank" rel="noopener">原始碼</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadPagesRepos() {
      const syncTimeEl = document.getElementById('syncTime');
      try {
        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const repos = await res.json();

        allPagesRepos = repos.filter(
          r => r.has_pages && r.name.toLowerCase() !== ROOT_REPO.toLowerCase()
        );

        syncTimeEl.textContent = '即時同步自 GitHub API';
      } catch (err) {
        console.warn('GitHub API 讀取失敗，使用預設快取清單：', err);
        allPagesRepos = FALLBACK_REPOS;
        syncTimeEl.textContent = '使用快取清單';
      }

      renderRepos(document.getElementById('searchInput').value);
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      renderRepos(e.target.value);
    });

    loadPagesRepos();
  </script>
</body>
</html>
